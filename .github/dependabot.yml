version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    cooldown:
      default-days: 7
    # Dependabot never writes news fragments, so exempt its pull requests from
    # the changelog check. Both labels must exist in the repository, otherwise
    # they are silently ignored.
    labels:
      - "dependencies"
      - "skip changelog"

  # The frontend: package.json and pnpm-lock.yaml. The npm ecosystem reads
  # pnpm lockfiles, and the directory is the one that holds the lockfile.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "skip changelog"

  # The docs: pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "skip changelog"
